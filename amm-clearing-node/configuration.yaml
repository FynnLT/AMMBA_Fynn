# AMM Clearing Node default configuration.
# Environment variables always override these values (guide §4.3):
#   OFFCHAIN_DB_URL, RPC_URL, CONTRACT_ADDRESS, CLEARING_NODE_PRIVATE_KEY,
#   TIME_SLOT_SEC, BLOCKCHAIN_MODE, HOST, PORT,
#   PREFERENCES_ENABLED, PREFERENCE_ORDER, MULTIPLIERS_ENABLED,
#   MULTIPLIER_MODE, MULTIPLIER_SIDES, GREEN_MULTIPLIER, GREY_LEVY, LEVY_CAP

application:
  host: "0.0.0.0"
  port: 8081

offchain_db:
  base_url: "http://localhost:8080"

blockchain:
  # "mock" simulates the on-chain anchor (no blockchain needed) — PoC default.
  # "live" sends real clearMarket transactions; requires rpc_url,
  # contract_address and CLEARING_NODE_PRIVATE_KEY.
  mode: "mock"
  rpc_url: "https://rpc.energyweb.org"
  contract_address: ""
  # Floor for the EIP-1559 priority fee, in wei (override: MIN_PRIORITY_FEE_WEI).
  # web3 estimates the priority fee from rewards in recent blocks. Energy Web
  # chains produce a block every ~5 s and most blocks are empty, so that
  # estimate is 0 and the transaction goes out at 2 x base fee (14 wei on
  # Volta) — accepted into the mempool, never included in a block, and
  # blocking every later transaction from the same account behind its nonce.
  min_priority_fee_wei: 1000000000   # 1 gwei

market:
  time_slot_sec: 900              # 15-minute slots (GSY DEX default)
  spot_open_offset_min: -180      # market opens 3h before delivery (informational —
  spot_close_offset_min: -60      #  the node only reacts to orchestrator triggers, §8)

# User preference mechanisms (guide §4.4 step 6, §6).
#
# `order`, `multipliers.mode` and `multipliers.sides` are set HERE ALONE: the
# demo UI no longer offers them and its trigger payload carries only the three
# numeric multiplier parameters, so these three values are whatever this file
# (or PREFERENCE_ORDER / MULTIPLIER_MODE / MULTIPLIER_SIDES) says. Running a
# different variant is a configuration change, not a code change — orders,
# modes and sides stay configuration axes (D-19), and this is how evaluation
# block 1 produces its comparison (pro_rata_first baseline, multiplicative vs.
# additive).
preferences:
  enabled: true
  # Allocation order: `preferences_first` is the design, `pro_rata_first` the
  # comparison variant; orders, modes and sides stay runnable as
  # configuration axes (D-19).
  order: "preferences_first"        # "preferences_first" | "pro_rata_first"

  multipliers:
    enabled: true
    mode: "multiplicative"          # "multiplicative" | "additive"
    sides: "seller"                 # "seller" | "both" — "seller" is the evaluation default (D-30)
    green_multiplier: 0.10
    grey_levy: 0.10
    levy_cap: 0.20

# Per-community sigmoid parameters. Unknown communities fall back to
# `default_community` (the demo UI creates communities on the fly).
communities:
  communityid_1:
    k_upper_ct_per_kwh: 40.0      # Retail buy price
    k_lower_ct_per_kwh: 8.0       # Feed-in tariff
    theta: 1.0                    # Sigmoid midpoint (optimized offline)
    steepness: 0.6                # Sigmoid steepness (optimized offline)
    # NOTE(poc-scope): the PoC names the pool AMM_POOL_{community_uuid} and
    # does not register it as an area in community_areas. A production
    # naming scheme is outside the proof of concept.
    pool_id: "AMM_POOL_communityid_1"

default_community:
  k_upper_ct_per_kwh: 40.0
  k_lower_ct_per_kwh: 8.0
  theta: 1.0
  steepness: 0.6
