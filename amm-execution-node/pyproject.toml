[project]
name = "amm-execution-node"
version = "0.1.0"
description = "AMM Execution Node: post-delivery penalty calculation (AMMBA PoC)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
]
