# AMMBA PoC stack: mock off-chain DB + clearing node + execution node + UI.
# Start everything:   docker-compose up --build
# UI:                 http://localhost:3000

services:
  mock-offchain-db:
    build: ./mock-offchain-db
    ports:
      - "8080:8080"
    networks: [ammba-net]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health_check', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  amm-clearing-node:
    build: ./amm-clearing-node
    environment:
      - OFFCHAIN_DB_URL=http://mock-offchain-db:8080
      # mock = simulated on-chain anchor (default). Set live + the vars below
      # to anchor on a real chain (see README "Live blockchain mode").
      - BLOCKCHAIN_MODE=${BLOCKCHAIN_MODE:-mock}
      - RPC_URL=${RPC_URL:-}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-}
      - CLEARING_NODE_PRIVATE_KEY=${CLEARING_NODE_PRIVATE_KEY:-}
      - TIME_SLOT_SEC=900
    ports:
      - "8081:8081"
    networks: [ammba-net]
    depends_on:
      mock-offchain-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  amm-execution-node:
    build: ./amm-execution-node
    environment:
      - OFFCHAIN_DB_URL=http://mock-offchain-db:8080
      - TIME_SLOT_SEC=900
      - EXECUTION_OFFSET_MIN=-120
      - POLLING_INTERVAL_SEC=300
      # PoC: the demo UI triggers execution explicitly (delivery time is
      # simulated); enable for production-style polling (guide §5.2).
      - POLLING_ENABLED=false
      - PENALTY_GAMMA=1.1
      - PENALTY_TOLERANCE_KWH=0.0
    ports:
      - "8082:8082"
    networks: [ammba-net]
    depends_on:
      mock-offchain-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  ui:
    build: ./ui
    ports:
      - "3000:80"
    networks: [ammba-net]
    depends_on:
      - amm-clearing-node
      - amm-execution-node
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ammba-net:
    driver: bridge
